[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nims-viewer"
version = "0.1.0"
description = "NIMS 마약류취급자 정보 조회 뷰어"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/nims_viewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
