[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poomgo-viewer"
version = "0.1.0"
description = "Poomgo invoice API viewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiomysql>=0.2,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/poomgo_viewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
